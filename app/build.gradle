buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://tbdsrepo.cloud.tencent.com/repository/maven-public/' }
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.c11partner.desktop'
    compileSdk 34
    defaultConfig {
        applicationId "com.c11partner.desktop"
        minSdk 25
        targetSdk 34
        versionCode 2
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            storeFile file('dipartner.jks')
            storePassword 'dipartner123'
            keyAlias 'dipartner'
            keyPassword 'dipartner123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    lint {
        abortOnError false
        disable 'OldTargetApi'
    }
    
    tasks.whenTaskAdded { task ->
        if (task.name.contains("Test")) {
            task.enabled = false
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.belerweb:pinyin4j:2.5.1'
    implementation 'com.tananaev:adblib:1.3'
    // 腾讯X5内核
    implementation 'com.tencent.tbs:tbssdk:44286'
}
