<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统界面</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- 基础依赖层 -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/bridge.js"></script>
    <!-- 核心功能层 -->
    <script src="js/theme.js"></script>
    <script src="js/widgets.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/datetime.js"></script>
    <script src="js/wallpaper.js"></script>
    <script src="js/wallpaper-manager.js"></script>
    <script src="js/wallpaper-swipe-bootstrap.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/music.js"></script>
    <script src="js/map.js"></script>
    <script src="js/index.js"></script>
</head>

<body>
    <!-- 主背景容器 -->
    <div class="background-container">
        <!-- 主背景图 -->
        <div class="background-image"></div>
        <!-- 壁纸预览层 -->
        <div class="wallpaper-preview" id="wallpaperPreview"></div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 顶部状态栏 -->
        <div class="top-status-bar">
            <!-- 左侧区域：时间 + 车辆状态 -->
            <div class="top-left-section">
                <!-- 时间显示 -->
                <div class="top-left-time">
                    <span class="time-text">--:--:--</span>
                </div>

                <!-- 车辆状态指示器 -->
                <div class="car-status-indicators">
                    <span id="gearIndicator" class="status-indicator gear-indicator">P档</span>
                    <span id="leftTurnIndicator" class="status-indicator turn-indicator">左转</span>
                    <span id="rightTurnIndicator" class="status-indicator turn-indicator">右转</span>
                    <span id="doorIndicator" class="status-indicator door-indicator" style="display:none;">门开</span>
                    <span id="lockIndicator" class="status-indicator lock-indicator">已锁</span>
                </div>
            </div>

            <!-- 右侧信息 -->
            <div class="top-right-info">
                <div id="bluetoothIcon" class="bluetooth-status-icon"
                    style="background-image: url('images/lanya.png');"></div>
                <div id="wifiIcon" class="network-status-icon"
                    style="background-image: url('images/wifi.png');"></div>
            </div>
        </div>

        <!-- 左侧布局 -->
        <div class="layout-left">
            <!-- 时间显示 -->
            <div class="time-text" id="timeDisplay">23:59:59</div>

            <!-- 日期显示 -->
            <div class="date-text" id="dateDisplay">2001年04月21日 星期四</div>

            <!-- 农历显示 -->
            <div class="lunar-calendar-text" id="lunarDisplay"></div>
        </div>
        <!-- 底部卡片 -->
        <div class="card-view">
                <div class="horizontal-scroll">
                    <!-- 地图组件 -->
                        <div class="widget map-widget">
                            <div class="map-icon"

                            <div class="nav-button" id="goHomeBtn" data-configurable="true">
                                <div class="nav-icon"
                                    style="background-image: url('images/nav_map_go_home.png');">
                                <div class="nav-text">回家</div>
                            </div>

                            <div class="nav-button" id="goCompanyBtn" data-configurable="true">
                                <div class="nav-icon"
                                    style="background-image: url('images/nav_map_go_company.png');">
                                </div>
                                <div class="nav-text">公司</div>
                            </div>
                        </div>
                    </div>

                    <!-- 音乐组件 -->
                        <div class="widget music-widget">
                            <div class="music-player">
                                <!-- 左侧黑胶唱片 -->
                                <div class="vinyl-record-container">
                                    <div class="vinyl-record" id="vinylRecord">
                                        <div class="vinyl-dot"></div>
                                    </div>
                                    <!-- 唱针 -->
                                    <div class="tonearm" id="tonearm"></div>
                                </div>

                                <!-- 右侧控制区 -->
                                <div class="controls">
                                    <!-- 歌曲名称 -->
                                    <div class="music-header">
                                        <span id="current-song-name" class="music-name">此刻无声，佳音已备候君启...</span>
                                    </div>

                                    <!-- 播放进度条 -->
                                    <div class="music-progress-container">
                                        <span class="music-current-time">00:00</span>
                                        <div class="music-progress-bar">
                                            <div class="music-progress-filled"></div>
                                        </div>
                                        <span class="music-total-time">00:00</span>
                                    </div>

                                    <!-- 控制按钮组 -->
                                    <div class="control-buttons">
                                        <button class="btn-prev" id="prev-btn"><img src="images/nav_music_next0.png"
                                                alt="上一首"></button>
                                        <button class="btn-play" id="play-pause-btn"><img
                                                src="images/nav_music_play.png" alt="播放"></button>
                                        <button class="btn-next" id="next-btn"><img src="images/nav_music_next1.png"
                                                alt="下一首"></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 快速启动App组件 -->
                        <div class="widget quick-apps-widget">
                            <div class="quick-apps-container" id="quickAppsContainer">
                                <!-- 快速启动应用将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <!-- 快捷开关组件 -->
                        <div class="widget quick-switches-widget">
                            <div class="quick-switches-container" id="quickSwitchesContainer">
                                <!-- 快捷开关将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <!-- 胎压组件 -->
                        <div class="widget car-widget">
                            <div class="car-image"
                            <div class="tire-pressure front-left">
                                    <div class="tire-pressure-value">--</div>
                                    <div class="tire-temp-value">--°</div>
                                </div>
                                <div class="tire-pressure front-right">
                                    <div class="tire-pressure-value">--</div>
                                    <div class="tire-temp-value">--°</div>
                                </div>
                                <div class="tire-pressure rear-left">
                                    <div class="tire-pressure-value">--</div>
                                    <div class="tire-temp-value">--°</div>
                                </div>
                                <div class="tire-pressure rear-right">
                                    <div class="tire-pressure-value">--</div>
                                    <div class="tire-temp-value">--°</div>
                                </div>
                                <div class="tire-loading-tip">正在获取胎压数据...</div>
                        </div>
                    </div>

                    <!-- 天气组件 -->
                        <div class="widget weather-widget">

                            <div class="weather-info">
                                <div class="temperature"></div>
                            </div>

                            <div class="weather-info">
                                <div class="condition"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部状态栏 -->
        <div class="status-bar">
            <!-- 左侧按钮组 -->
            <div class="left-buttons">
                <button class="control-icon" id="appsBtn"
                    style="background-image: url('images/nav_apps.png'); width: 25px; height: 25px; background-color: transparent;border: none;"></button>
                <button class="control-icon" id="tasksBtn"
                    style="background-image: url('images/nav_tasks.png'); width: 25px; height: 25px; margin-left: 20px; background-color: transparent;border: none;"></button>
            </div>

            <!-- 中间控制组 -->
            <div class="center-controls">
                <div class="ac-control rotate-animation" id="acControl"
                    style="background-image: url('images/nav_air.png');"></div>
                <div class="ac-control" id="acMinus"
                    style="background-image: url('images/nav_minus.png');"></div>
                <div class="air-text">22°</div>
                <div class="ac-control" id="acPlus"
                    style="background-image: url('images/nav_add.png');"></div>
                <div class="ac-control" id="acArrow1"
                    style="background-image: url('images/nav_arrow1.png');"></div>

                <div class="wind-display">
                    <div class="wind-background"
                        style="background-image: url('images/nav_air.png');"></div>
                    <div class="wind-level"
                        style="background-image: url('images/wind_level_06.png');"></div>
                </div>

                <div class="ac-control" id="acArrow2"
                    style="background-image: url('images/nav_arrow2.png');"></div>
                <div class="ac-control" id="acWindMinus"
                    style="background-image: url('images/nav_minus.png');"></div>
                <div class="air-text">22°</div>
                <div class="ac-control" id="acWindPlus"
                    style="background-image: url('images/nav_add.png');"></div>
                <div class="ac-hcs" id="acHcs"
                    style="background-image: url('images/nav_ac_hcs.png');"></div>
            </div>

            <!-- 右侧按钮组 -->
            <div class="right-buttons">
                <button class="control-icon" id="camera360Btn"
                    style="background-image: url('images/nav_camera.png'); width: 25px; height: 25px; background-color: transparent; border: none;"></button>
                <button class="control-icon" id="settingsBtn"
                    style="background-image: url('images/nav_seetings.png'); width: 25px; height: 25px; margin-left: 20px; background-color: transparent; border: none;"></button>
            </div>
        </div>




        <!-- 设置弹窗页面 -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>设置</h2>
                    <span class="close" id="closeSettings">&times;</span>
                </div>
                <!-- TAB导航 -->
                <div class="tab-navigation">
                    <button class="tab-button active" data-tab="wallpaper">壁纸设置</button>
                    <button class="tab-button" data-tab="components">组件配置</button>
                    <button class="tab-button" data-tab="apps">系统管理</button>
                </div>
                <div class="modal-body">
                    <!-- 壁纸设置TAB -->
                    <div class="tab-content" id="wallpaper-tab">
                        <div class="setting-section">
                            <h3>壁纸类型</h3>
                            
                            <div class="wallpaper-type-list">
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="0" checked>
                                    <span class="type-icon">🏠</span>
                                    <span class="type-name">默认壁纸</span>
                                    <span class="type-desc">内置默认背景图片</span>
                                </label>
                                
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="1">
                                    <span class="type-icon">🌄</span>
                                    <span class="type-name">必应壁纸</span>
                                    <span class="type-desc">每日自动更新精美壁纸</span>
                                </label>
                                
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="2">
                                    <span class="type-icon">🖼️</span>
                                    <span class="type-name">本地图片</span>
                                    <span class="type-desc">选择单张图片作为壁纸</span>
                                </label>
                                
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="3">
                                    <span class="type-icon">🎬</span>
                                    <span class="type-name">本地视频</span>
                                    <span class="type-desc">选择视频作为动态壁纸</span>
                                </label>
                                
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="4">
                                    <span class="type-icon">📁</span>
                                    <span class="type-name">本地文件夹</span>
                                    <span class="type-desc">文件夹内图片/视频自动轮播</span>
                                </label>
                                
                                <label class="wallpaper-type-item disabled">
                                    <input type="radio" name="wallpaperType" value="5" disabled>
                                    <span class="type-icon">🌐</span>
                                    <span class="type-name">iframe壁纸</span>
                                    <span class="type-desc">网页壁纸（暂未开放）</span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="setting-section" id="wallpaperPathSection" style="display:none;">
                            <h3>壁纸路径</h3>
                            <div class="setting-item">
                                <input type="text" id="wallpaperPathInput" class="setting-input" 
                                    placeholder="请输入文件或文件夹路径">
                            </div>
                            <div class="setting-item">
                                <button class="setting-btn" id="pickWallpaperFileBtn">选择文件</button>
                                <button class="setting-btn" id="pickWallpaperFolderBtn">选择文件夹</button>
                            </div>
                        </div>
                        
                        <div class="setting-section">
                            <h3>轮播设置</h3>
                            
                            <div class="setting-item">
                                <label>启用轮播</label>
                                <input type="checkbox" id="wallpaperCarouselV2Checkbox" class="setting-checkbox">
                            </div>
                            
                            <div class="setting-item">
                                <label>轮播间隔（秒）</label>
                                <input type="number" id="wallpaperIntervalV2Input" class="setting-input" 
                                    value="15" min="5" max="3600" style="width: 100px;">
                            </div>
                        </div>
                        
                        <div class="setting-section">
                            <h3>显示设置</h3>
                            
                            <div class="setting-item">
                                <label>填充模式</label>
                                <select id="wallpaperFillModeSelect" class="setting-select">
                                    <option value="0">填充（裁剪）</option>
                                    <option value="1">包含（留白）</option>
                                    <option value="2">拉伸</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="setting-section" id="bingWallpaperSection" style="display:none;">
                            <h3>必应壁纸</h3>
                            <div class="setting-item">
                                <button class="setting-btn" id="refreshBingWallpaperBtn">立即刷新壁纸</button>
                                <span class="setting-hint">每天自动更新一次</span>
                            </div>
                        </div>
                        
                        <div class="setting-item">
                            <button class="setting-btn primary" id="applyWallpaperBtn">应用设置</button>
                        </div>
                    </div>
                    
                    <div class="tab-content" id="components-tab">
                        <div class="setting-item">
                            <label>音乐组件</label>
                            <input type="checkbox" id="musicComponentCheckbox" class="setting-checkbox">
                        </div>
                        <div class="setting-item">
                            <label>地图组件</label>
                            <input type="checkbox" id="mapComponentCheckbox" class="setting-checkbox">
                        </div>
                        <div class="setting-item">
                            <label>APP组件</label>
                            <input type="checkbox" id="appComponentCheckbox" class="setting-checkbox">
                        </div>
                        <div class="setting-item">
                            <label>胎压组件</label>
                            <input type="checkbox" id="tirePressureComponentCheckbox"
                                class="setting-checkbox">
                        </div>
                        <div class="setting-item">
                            <label>天气组件</label>
                            <input type="checkbox" id="weatherComponentCheckbox"
                                class="setting-checkbox">
                        </div>
                    </div>

                    <!-- 系统管理TAB -->
                    <div class="tab-content" id="apps-tab">
                        <div class="setting-item">
                            <label>桌面自启</label>
                            <input type="checkbox" id="systemLauncherCheckbox" class="setting-checkbox">
                        </div>
                        <div class="setting-item">
                            <label>开机问候</label>
                            <input type="checkbox" id="bootGreetingCheckbox" class="setting-checkbox">
                        </div>
                        <!-- 添加重启应用按钮 -->
                        <div class="setting-item">
                            <label>应用控制</label>
                            <button class="setting-button" id="restartAppBtn">重启应用</button>
                        </div>
                        <div class="setting-item">
                            <label>应用设置</label>
                            <button class="setting-button" id="setDefaultDesktopBtn">默认桌面</button>
                        </div>
                        <div class="setting-item">
                            <label>授权管理</label>
                            <button class="setting-button" id="adbAuthorizationBtn">申请ADB</button>
                        </div>
                        
                        <!-- 语音指令测试（开发者工具） -->
                        <div class="setting-item voice-test-section">
                            <label>语音指令测试</label>
                            <div class="voice-test-container">
                                <input type="text" id="voiceCommandInput" class="voice-test-input" 
                                    placeholder="输入语音指令，如：打开空调、温度调到24度">
                                <button class="setting-button voice-test-btn" id="voiceTestBtn">发送测试</button>
                            </div>
                            <div class="voice-test-result" id="voiceTestResult"></div>
                            <div class="voice-test-tips">
                                <p>💡 常用测试指令：</p>
                                <div class="voice-quick-commands">
                                    <span class="quick-cmd" data-cmd="打开空调">打开空调</span>
                                    <span class="quick-cmd" data-cmd="关闭空调">关闭空调</span>
                                    <span class="quick-cmd" data-cmd="温度调到24度">温度24度</span>
                                    <span class="quick-cmd" data-cmd="打开除霜">打开除霜</span>
                                    <span class="quick-cmd" data-cmd="打开近光灯">打开近光灯</span>
                                    <span class="quick-cmd" data-cmd="切换到舒适模式">舒适模式</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 应用列表弹窗 -->
        <div id="appsModal" class="modal">
            <div class="apps-modal-content">
                <div class="apps-modal-header">
                    <h2>应用列表</h2>
                    <span class="close" id="closeApps">&times;</span>
                </div>
                <div class="apps-modal-body">
                    <!-- 搜索框 -->
                    <div class="search-container">
                        <input type="text" id="appSearch" placeholder="搜索应用...">
                    </div>

                    <!-- 分类切换标签 -->
                    <div class="app-category-tabs">
                        <button class="app-tab active" data-category="all">全部</button>
                        <button class="app-tab" data-category="user">用户应用</button>
                        <button class="app-tab" data-category="system">系统应用</button>
                    </div>

                    <!-- 应用列表内容 -->
                    <div class="apps-content">
                        <!-- 字母导航栏 -->
                        <div class="alphabet-nav">
                            <ul id="alphabetList">
                                <!-- 字母将通过JavaScript动态生成 -->
                            </ul>
                        </div>

                        <!-- 应用列表 -->
                        <div class="apps-list-container">
                            <div id="appsList">
                                <!-- 应用列表将通过JavaScript动态生成 -->
                            </div>
                            <!-- 加载提示 -->
                            <div id="appsLoading"
                                style="display: none; text-align: center; padding: 15px; color: #aaa;">
                                <div style="font-size: 14px; margin-bottom: 8px;">加载中...</div>
                                <div class="loading-spinner"
                                    style="border: 3px solid #333; border-top: 3px solid #007bff; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载动画样式 -->
    <style>
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 旋转动画样式 */
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .rotate-animation {
            animation: rotate 2s linear infinite;
        }
    </style>

</body>

</html>
