<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C11伙伴 - 零跑C11专属车载桌面</title>
    <!-- 无障碍支持 -->
    <meta name="theme-color" content="#1a1a1f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- CSS模块直接引入（避免@import在某些WebView环境中不生效，加v参数强制刷新缓存） -->
    <link rel="stylesheet" href="css/theme.css?v=2">
    <link rel="stylesheet" href="css/base.css?v=2">
    <link rel="stylesheet" href="css/animations.css?v=2">
    <link rel="stylesheet" href="css/components.css?v=2">
    <link rel="stylesheet" href="css/widgets.css?v=2">
    <link rel="stylesheet" href="css/pages.css?v=2">
    <link rel="stylesheet" href="css/responsive.css?v=2">

    <!-- 特效等级：在DOM渲染前应用，避免动画闪烁 -->
    <script>
    (function() {
        try {
            var level = 'none';
            var raw = localStorage.getItem('app_settings');
            if (raw) {
                var parsed = JSON.parse(raw);
                if (parsed && parsed.ui && parsed.ui.effectLevel) {
                    level = parsed.ui.effectLevel;
                }
            }
            document.documentElement.classList.add('effect-' + level);
        } catch(e) {
            document.documentElement.classList.add('effect-none');
        }
    })();
    </script>

    <!-- 基础依赖层 -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/bridge.js"></script>

    <!-- 核心框架层 -->
    <script src="js/bootstrap.js"></script>
    <script src="js/settings-sync.js"></script>
    <script src="js/ui-initializer.js"></script>
    <script src="js/app-list-manager.js"></script>

    <!-- 核心功能层 -->
    <script src="js/theme.js"></script>
    <script src="js/widgets.js"></script>

    <!-- 业务逻辑层 -->
    <script src="js/music.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/datetime.js"></script>
    <script src="js/wallpaper-manager.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/map.js"></script>
    <script src="js/async-callback-manager.js"></script>
    <script src="js/system-music-manager.js"></script>
    <script src="js/car-state-manager.js"></script>
    <script src="js/gear-bridge.js"></script>
    <script src="js/automation-manager.js"></script>
    <script src="js/quick-switch-manager.js"></script>
    <script src="js/index.js"></script>
</head>
<body>
    <!-- 主背景容器 -->
    <div class="background-container">
        <div class="background-image"></div>
        <div class="wallpaper-preview" id="wallpaperPreview"></div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 顶部状态栏 -->
        <header class="top-status-bar">
            <!-- 左侧区域：主题切换 + 车辆状态 -->
            <div class="top-left-section">
                <div class="theme-toggle-icon" id="themeToggleIcon" title="切换主题">🌙</div>
                <div class="car-status-indicators">
                    <!-- 档位显示 -->
                    <span class="status-indicator gear-indicator" id="gearIndicator">P档</span>
                    
                    <!-- 车速显示 -->
                    <span class="status-indicator speed-indicator" id="speedIndicator">0 km/h</span>
                    
                    <!-- 转向灯组 -->
                    <div class="turn-indicators-group">
                        <span class="status-indicator turn-indicator" id="leftTurnIndicator">◀ 左转</span>
                        <span class="status-indicator turn-indicator" id="rightTurnIndicator">右转 ▶</span>
                    </div>
                    
                    <!-- 门锁状态 -->
                    <span class="status-indicator lock-indicator" id="lockIndicator">🔒 已锁</span>
                    
                    <!-- 门窗状态容器 -->
                    <div class="door-window-status" id="doorWindowStatus">
                        <span class="dw-status dw-door" id="frontLeftDoorStatus" title="主驾车门">主驾门</span>
                        <span class="dw-status dw-window" id="frontLeftWindowStatus" title="主驾车窗">主驾窗</span>
                        <span class="dw-status dw-door" id="frontRightDoorStatus" title="副驾车门">副驾门</span>
                        <span class="dw-status dw-window" id="frontRightWindowStatus" title="副驾车窗">副驾窗</span>
                        <span class="dw-status dw-door" id="rearLeftDoorStatus" title="左后车门">左后门</span>
                        <span class="dw-status dw-window" id="rearLeftWindowStatus" title="左后车窗">左后窗</span>
                        <span class="dw-status dw-door" id="rearRightDoorStatus" title="右后车门">右后门</span>
                        <span class="dw-status dw-window" id="rearRightWindowStatus" title="右后车窗">右后窗</span>
                    </div>
                </div>
            </div>
            <!-- 右侧信息 -->
            <div class="top-right-info">
                <div class="network-status-icon" id="wifiIcon"
                    style="background-image: url('images/wifi.png');"></div>
                <div class="bluetooth-status-icon" id="bluetoothIcon"
                    style="background-image: url('images/lanya.png');"></div>
                <div class="location-status-icon" id="locationIcon"
                    style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;white&quot;><path d=&quot;M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z&quot;/></svg>');"></div>
            </div>
        </header>

        <!-- 左侧布局 -->
        <aside class="layout-left">
            <div class="time-text" id="timeDisplay">23:59:59</div>
            <div class="date-text" id="dateDisplay">2001年04月21日 星期四</div>
            <div class="lunar-calendar-text" id="lunarDisplay"></div>
        </aside>

        <!-- 底部卡片区域 -->
        <main class="card-view">
            <div class="horizontal-scroll">
                <!-- 地图组件 -->
                <section class="widget map-widget">
                    <div class="map-icon"></div>
                    <div class="nav-button" id="goHomeBtn" data-configurable="true">
                        <div class="nav-icon"
                            style="background-image: url('images/nav_map_go_home.png');"></div>
                        <div class="nav-text">回家</div>
                    </div>
                    <div class="nav-button" id="goCompanyBtn" data-configurable="true">
                        <div class="nav-icon"
                            style="background-image: url('images/nav_map_go_company.png');"></div>
                        <div class="nav-text">公司</div>
                    </div>
                </section>

                <!-- 音乐组件 -->
                <section class="widget music-widget">
                    <div class="music-player">
                        <!-- 左侧黑胶唱片 -->
                        <div class="vinyl-record-container">
                            <div class="vinyl-record" id="vinylRecord">
                                <div class="vinyl-dot"></div>
                            </div>
                            <div class="tonearm" id="tonearm"></div>
                        </div>

                        <!-- 右侧控制区 -->
                        <div class="controls">
                            <div class="music-header">
                                <span class="music-name" id="current-song-name">此刻无声，佳音已备候君启...</span>
                            </div>
                            <div class="music-progress-container">
                                <span class="music-current-time">00:00</span>
                                <div class="music-progress-bar">
                                    <div class="music-progress-filled"></div>
                                </div>
                                <span class="music-total-time">00:00</span>
                            </div>
                            <div class="control-buttons">
                                <button class="btn-prev" id="prev-btn">
                                    <img src="images/nav_music_next0.png" alt="上一首">
                                </button>
                                <button class="btn-play" id="play-pause-btn">
                                    <img src="images/nav_music_play.png" alt="播放">
                                </button>
                                <button class="btn-next" id="next-btn">
                                    <img src="images/nav_music_next1.png" alt="下一首">
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 快速启动App组件 -->
                <section class="widget quick-apps-widget">
                    <div class="quick-apps-container" id="quickAppsContainer">
                        <!-- 快速启动应用将通过JavaScript动态生成 -->
                    </div>
                </section>

                <!-- 快捷开关组件 -->
                <section class="widget quick-switches-widget">
                    <div class="quick-switches-container" id="quickSwitchesContainer">
                        <!-- 快捷开关将通过JavaScript动态生成 -->
                    </div>
                </section>

                <!-- 胎压组件 -->
                <section class="widget car-widget">
                    <div class="car-image"></div>
                    <div class="tire-pressure front-left">
                        <div class="tire-pressure-value">--</div>
                        <div class="tire-temp-value">--°</div>
                    </div>
                    <div class="tire-pressure front-right">
                        <div class="tire-pressure-value">--</div>
                        <div class="tire-temp-value">--°</div>
                    </div>
                    <div class="tire-pressure rear-left">
                        <div class="tire-pressure-value">--</div>
                        <div class="tire-temp-value">--°</div>
                    </div>
                    <div class="tire-pressure rear-right">
                        <div class="tire-pressure-value">--</div>
                        <div class="tire-temp-value">--°</div>
                    </div>
                    <div class="tire-loading-tip">正在获取胎压数据...</div>
                </section>

                <!-- 天气组件 -->
                <!-- 天气组件 - #字形布局 -->
                <section class="widget weather-widget">
                    <div class="weather-left">
                        <div class="temperature" data-temp="--">--</div>
                        <div class="condition">加载中</div>
                    </div>
                    <div class="weather-center">
                        <div class="weather-car-icon"></div>
                    </div>
                    <div class="weather-right">
                        <div class="weather-detail">湿度 --%</div>
                        <div class="weather-detail">风速 --km/h</div>
                        <div class="weather-detail">PM2.5 --</div>
                    </div>
                </section>
            </div>
        </main>

        <!-- 设置弹窗页面 -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>设置</h2>
                    <span class="close" id="closeSettings">&times;</span>
                </div>

                <!-- TAB导航 -->
                <nav class="tab-navigation">
                    <button class="tab-button active" data-tab="wallpaper">壁纸设置</button>
                    <button class="tab-button" data-tab="components">组件配置</button>
                    <button class="tab-button" data-tab="apps">系统管理</button>
                    <button class="tab-button" data-tab="ui">界面设置</button>
                </nav>

                <div class="modal-body">
                    <!-- 壁纸设置TAB -->
                    <section class="tab-content active" id="wallpaper-tab">
                        <div class="setting-section">
                            <h3>壁纸类型</h3>
                            <div class="wallpaper-type-list">
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="1" checked>
                                    <span class="type-icon">🌄</span>
                                    <span class="type-name">必应壁纸</span>
                                    <span class="type-desc">每日自动更新精美壁纸</span>
                                </label>
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="2">
                                    <span class="type-icon">🖼️</span>
                                    <span class="type-name">本地壁纸</span>
                                    <span class="type-desc">选择图片作为壁纸</span>
                                </label>
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="3">
                                    <span class="type-icon">🎬</span>
                                    <span class="type-name">视频壁纸</span>
                                    <span class="type-desc">选择视频作为动态壁纸</span>
                                </label>
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="wallpaperType" value="5">
                                    <span class="type-icon">🚗</span>
                                    <span class="type-name">3D车模</span>
                                    <span class="type-desc">3D动态车模壁纸</span>
                                </label>
                            </div>
                        </div>

                        <div class="setting-section" id="wallpaperPathSection" style="display:none;">
                            <h3>选择文件</h3>
                            <div class="setting-item">
                                <input type="text" class="setting-input" id="wallpaperPathInput"
                                    placeholder="请选择文件路径">
                            </div>
                            <div class="setting-item">
                                <button class="setting-btn" id="pickWallpaperFileBtn">选择文件</button>
                            </div>
                        </div>

                        <div class="setting-section">
                            <h3>显示设置</h3>
                            <div class="setting-item">
                                <label>填充模式</label>
                                <select class="setting-select" id="wallpaperFillModeSelect">
                                    <option value="0">填充（裁剪）</option>
                                    <option value="1">包含（留白）</option>
                                    <option value="2">拉伸</option>
                                </select>
                            </div>
                        </div>

                        <div class="setting-section" id="bingWallpaperSection">
                            <h3>必应壁纸</h3>
                            <div class="setting-item">
                                <button class="setting-btn" id="refreshBingWallpaperBtn">立即刷新壁纸</button>
                                <span class="setting-hint">每天自动更新一次</span>
                            </div>
                        </div>

                        <div class="setting-item">
                            <button class="setting-btn primary" id="applyWallpaperBtn">应用设置</button>
                        </div>
                    </section>

                    <!-- 组件配置TAB -->
                    <section class="tab-content" id="components-tab">
                        <div class="setting-item">
                            <label>音乐组件</label>
                            <input type="checkbox" class="setting-checkbox" id="musicComponentCheckbox">
                        </div>
                        <div class="setting-item">
                            <label>地图组件</label>
                            <input type="checkbox" class="setting-checkbox" id="mapComponentCheckbox">
                        </div>
                        <div class="setting-item">
                            <label>APP组件</label>
                            <input type="checkbox" class="setting-checkbox" id="appComponentCheckbox">
                        </div>
                        <div class="setting-item">
                            <label>胎压组件</label>
                            <input type="checkbox" class="setting-checkbox" id="tirePressureComponentCheckbox">
                        </div>
                        <div class="setting-item">
                            <label>天气组件</label>
                            <input type="checkbox" class="setting-checkbox" id="weatherComponentCheckbox">
                        </div>
                    </section>

                    <!-- 系统管理TAB -->
                    <section class="tab-content" id="apps-tab">
                        <div class="setting-item">
                            <label>桌面自启</label>
                            <input type="checkbox" class="setting-checkbox" id="systemLauncherCheckbox">
                        </div>
                        <div class="setting-item">
                            <label>开机问候</label>
                            <input type="checkbox" class="setting-checkbox" id="bootGreetingCheckbox">
                        </div>
                        <div class="setting-item">
                            <label>应用控制</label>
                            <button class="setting-button" id="restartAppBtn">重启应用</button>
                        </div>
                        <div class="setting-item">
                            <label>应用设置</label>
                            <button class="setting-button" id="setDefaultDesktopBtn">默认桌面</button>
                        </div>
                        <div class="setting-item">
                            <label>授权管理</label>
                            <button class="setting-button" id="adbAuthorizationBtn">申请ADB</button>
                        </div>
                    </section>

                    <!-- 界面设置TAB -->
                    <section class="tab-content" id="ui-tab">
                        <div class="setting-section">
                            <h3>特效等级</h3>
                            <p class="setting-hint" style="margin-bottom:12px;">降低特效等级可显著提升车机流畅度</p>
                            <div class="wallpaper-type-list">
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="effectLevel" value="none" checked>
                                    <span class="type-icon">🚫</span>
                                    <span class="type-name">无特效</span>
                                    <span class="type-desc">关闭所有动画和特效，最佳性能</span>
                                </label>
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="effectLevel" value="low">
                                    <span class="type-icon">⚡</span>
                                    <span class="type-name">最低特效</span>
                                    <span class="type-desc">保留基础过渡，兼顾性能与体验</span>
                                </label>
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="effectLevel" value="high">
                                    <span class="type-icon">✨</span>
                                    <span class="type-name">全特效</span>
                                    <span class="type-desc">全部动画特效，最佳视觉体验</span>
                                </label>
                            </div>
                        </div>
                        <div class="setting-section">
                            <h3>主题模式</h3>
                            <div class="wallpaper-type-list">
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="themeMode" value="dark" checked>
                                    <span class="type-icon">🌙</span>
                                    <span class="type-name">深色模式</span>
                                    <span class="type-desc">适合夜间驾驶，降低眩光</span>
                                </label>
                                <label class="wallpaper-type-item">
                                    <input type="radio" name="themeMode" value="light">
                                    <span class="type-icon">☀️</span>
                                    <span class="type-name">白天模式</span>
                                    <span class="type-desc">适合白天使用，清晰明亮</span>
                                </label>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>

        <!-- 应用列表弹窗 -->
        <div class="modal" id="appsModal">
            <div class="apps-modal-content">
                <div class="apps-modal-header">
                    <h2>应用列表</h2>
                    <span class="close" id="closeApps">&times;</span>
                </div>
                <div class="apps-modal-body">
                    <!-- 搜索框 -->
                    <div class="search-container">
                        <input type="text" id="appSearch" placeholder="搜索应用...">
                    </div>

                    <!-- 分类切换标签 -->
                    <nav class="app-category-tabs">
                        <button class="app-tab active" data-category="all">全部</button>
                        <button class="app-tab" data-category="user">用户应用</button>
                        <button class="app-tab" data-category="system">系统应用</button>
                    </nav>

                    <!-- 应用列表内容 -->
                    <div class="apps-content">
                        <!-- 字母导航栏 -->
                        <aside class="alphabet-nav">
                            <ul id="alphabetList">
                                <!-- 字母将通过JavaScript动态生成 -->
                            </ul>
                        </aside>

                        <!-- 应用列表 -->
                        <div class="apps-list-container">
                            <div id="appsList">
                                <!-- 应用列表将通过JavaScript动态生成 -->
                            </div>
                            <!-- 加载提示 -->
                            <div id="appsLoading" class="apps-loading-placeholder">
                                <div class="loading-tip-text">加载中...</div>
                                <div class="loading-spinner-small">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
