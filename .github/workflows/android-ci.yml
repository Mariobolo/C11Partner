name: Android CI Build
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-30 build-tools;30.0.3'
        cmdline-tools-version: 'latest'
    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-30" "build-tools;30.0.3"
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Run commit message check
      run: |
        echo "=== 检查最新提交信息 ==="
        LATEST_COMMIT_MSG=$(git log -1 --pretty=%B)
        echo "提交信息: $LATEST_COMMIT_MSG"
        python3 tools/check_commit_msg.py "$LATEST_COMMIT_MSG"
    - name: Install coverage tools
      run: |
        pip install coverage
    - name: Run unit tests with coverage
      run: |
        echo "=== 运行单元测试（带覆盖率） ==="
        coverage run --source=tools -m pytest tests/ -v || coverage run --source=tools tests/test_check_commit_msg.py
        coverage run --append --source=tools tests/test_generate_code_index.py
        coverage run --append --source=tools tests/test_generate_api_docs.py
        
        echo ""
        echo "=== 覆盖率报告 ==="
        coverage report -m
        
        echo ""
        echo "=== 生成 HTML 报告 ==="
        coverage html -d coverage_html
    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: coverage_html/
        retention-days: 7
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Clean previous build
      run: ./gradlew clean --no-build-cache 2>&1 | grep -v "Warning: Mapping new ns" || true
    - name: Build debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | grep -v "Warning: Mapping new ns" | tee build-debug.log
    - name: Build release APK
      run: |
        set -o pipefail
        ./gradlew assembleRelease --stacktrace 2>&1 | grep -v "Warning: Mapping new ns" | tee build-release.log
    - name: Upload build error log
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: build-error-log
        path: |
          build-debug.log
          build-release.log
        retention-days: 14
    - name: Find APK files
      id: find_apk
      run: |
        echo "=== 查找APK文件 ==="
        echo ""
        echo "--- 列出 build/outputs 目录 ---"
        ls -la app/build/outputs/ 2>/dev/null || echo "outputs 目录不存在"
        echo ""
        echo "--- 列出所有 APK 文件 ---"
        find app/build -name "*.apk" -type f 2>/dev/null || echo "未找到任何 APK 文件"
        echo ""
        
        # 查找 Debug APK
        DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -z "$DEBUG_APK" ]; then
            # 扩大范围查找
            DEBUG_APK=$(find app/build -name "*debug*.apk" -type f 2>/dev/null | head -1)
        fi
        
        # 查找 Release APK
        RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -z "$RELEASE_APK" ]; then
            # 扩大范围查找
            RELEASE_APK=$(find app/build -name "*release*.apk" -type f 2>/dev/null | head -1)
        fi
        
        echo "debug_apk=$DEBUG_APK" >> $GITHUB_OUTPUT
        echo "release_apk=$RELEASE_APK" >> $GITHUB_OUTPUT
        
        echo "Debug APK: $DEBUG_APK"
        echo "Release APK: $RELEASE_APK"
    - name: Upload debug APK
      if: steps.find_apk.outputs.debug_apk != ''
      uses: actions/upload-artifact@v6
      with:
        name: C11Partner-debug
        path: ${{ steps.find_apk.outputs.debug_apk }}
        retention-days: 30
    - name: Upload release APK
      if: steps.find_apk.outputs.release_apk != ''
      uses: actions/upload-artifact@v6
      with:
        name: C11Partner-release
        path: ${{ steps.find_apk.outputs.release_apk }}
        retention-days: 90
    - name: Create GitHub Release (打标签时触发)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.find_apk.outputs.debug_apk }}
          ${{ steps.find_apk.outputs.release_apk }}
        name: Release v${{ github.ref_name }}
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
