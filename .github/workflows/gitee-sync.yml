# ============================================
# GitHub -> Gitee 自动同步（SSH Deploy Key 方案）
# 权限只限于单个 Gitee 仓库，不会暴露账户级权限
# ============================================
name: Sync to Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，确保同步完整

      - name: Setup SSH and sync to Gitee
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || github.event.repository.name }}
        run: |
          if [ -z "$GITEE_SSH_KEY" ]; then
            echo "::error::缺少 GITEE_SSH_KEY secret"
            echo "请按以下步骤配置："
            echo "1. 本地生成密钥对：ssh-keygen -t ed25519 -C 'github-actions' -f gitee_sync"
            echo "2. 把 gitee_sync.pub 添加到 Gitee 仓库 → 管理 → 部署公钥 → 添加（勾选'可推送'）"
            echo "3. 把 gitee_sync（私钥内容）粘贴到 GitHub 仓库 Settings → Secrets → Actions → GITEE_SSH_KEY"
            exit 1
          fi
          if [ -z "$GITEE_OWNER" ]; then
            echo "::error::缺少 GITEE_OWNER secret"
            exit 1
          fi

          # 配置 SSH
          mkdir -p ~/.ssh
          echo "$GITEE_SSH_KEY" > ~/.ssh/gitee_sync
          chmod 600 ~/.ssh/gitee_sync

          # 添加 Gitee 到 known_hosts，防止交互式确认
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts 2>/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 添加 Gitee remote（SSH 方式）
          git remote add gitee "git@gitee.com:${GITEE_OWNER}/${GITEE_REPO}.git"

          # 使用 SSH 密钥推送
          echo "正在同步到 gitee.com/${GITEE_OWNER}/${GITEE_REPO} ..."
          GIT_SSH_COMMAND="ssh -i ~/.ssh/gitee_sync -o IdentitiesOnly=yes" \
            git push gitee --all --force
          GIT_SSH_COMMAND="ssh -i ~/.ssh/gitee_sync -o IdentitiesOnly=yes" \
            git push gitee --tags --force

          echo "同步完成"
