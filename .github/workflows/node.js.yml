# 全平台 npm 项目自动构建 CI
name: Build and Test

# 触发条件：推送到 main 分支、创建 PR、发布标签
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

# 并发控制：同一分支只运行最新的一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    
    # 全平台 + 主流 Node.js 版本矩阵
    strategy:
      fail-fast: false  # 一个平台失败不中断其他平台
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ 20.x, 22.x ]  # LTS 版本 + 最新稳定版

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  # 自动缓存 node_modules，大幅提速

      - name: 安装依赖
        run: npm ci  # CI 环境推荐用 npm ci，严格遵循 package-lock.json

      - name: 运行代码检查（可选）
        run: npm run lint --if-present

      - name: 运行单元测试
        run: npm test --if-present

      - name: 构建项目
        run: npm run build --if-present

      - name: 上传构建产物（可选）
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/  # 你的构建输出目录，根据项目调整
          retention-days: 7  # 保留7天

  # 可选：发布到 npm 仓库（仅在打 tag 时触发）
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
      
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
